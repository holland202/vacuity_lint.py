name: Vacuity Lint Gate

on: [push, pull_request]

jobs:
  vacuity_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run vacuity_lint selftest
        run: python3 vacuity_lint.py --selftest
      - name: Scan repo
        run: python3 vacuity_lint.py . || echo "Findings detected; review above"
