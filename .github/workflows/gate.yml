name: Vacuity Lint Gate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  vacuity_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run vacuity_lint selftest
        run: python3 vacuity_lint.py --selftest
      - name: Regression and gate sabotage tests
        run: python3 -m unittest discover -s tests -v
      - name: Prove issue 7 regression tests reject deliberate scanner defects
        run: python3 ci/check_issue7_mutants.py
      - name: Prove VL-FP-001 regression tests reject each removed guard
        run: python3 VLFP001/mutants.py
      - name: Prepare fixture-free scan tree
        run: |
          scan=$(mktemp -d "$RUNNER_TEMP/vacuity-scan.XXXXXX")
          tar --exclude=./E16/fixtures --exclude=./independent/IE1/package --exclude=./.git -cf - . | tar -xf - -C "$scan"
          printf 'VACUITY_SCAN_ROOT=%s\n' "$scan" >> "$GITHUB_ENV"
      - name: Require clean, intended planted failure, then clean
        run: python3 ci/verify_gate.py vacuity_lint.py "$VACUITY_SCAN_ROOT" --evidence-dir "$RUNNER_TEMP/vacuity-gate-evidence"
      - name: Scan repo and preserve exact planted-fixture expectations
        run: |
          python3 vacuity_lint.py "$VACUITY_SCAN_ROOT"
          python3 ci/verify_fixtures.py
          python3 independent/IE1/package/independent_cases/run_independent.py vacuity_lint.py independent/IE1/package/independent_cases
      - name: Provenance audit selftest
        run: python3 provenance_audit.py --selftest
      - name: Mutation probe selftest
        run: python3 mutation_probe.py --selftest
      - name: E17-B scorer selftest, recorded outcome, and sabotage must differ
        run: |
          python3 E17B/run_e17b.py --selftest
          python3 E17B/run_e17b.py evaluate E17B/output/results.json
          if python3 E17B/run_e17b.py evaluate E17B/output/results.json --sabotage; then echo 'sabotage did not change the outcome'; exit 1; fi
